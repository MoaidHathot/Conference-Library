<!-- Body slot for layout.html -->

<section class="hero">
    <h2>{{HERO_HEADING}}</h2>
    <p><strong id="session-count-text">{{TOTAL_COUNT}}</strong>, searchable across titles, speakers, tags, topics, and summary text. Each session links through to its transcript, generated summary, sampled frames, and the canonical source page.</p>
</section>

<form class="filters" onsubmit="return false">
    <input id="filter-search" type="search" placeholder="Search title, speaker, summary…" autocomplete="off">
    <select id="filter-type"></select>
    <select id="filter-topic"></select>
    <select id="filter-tag"></select>
</form>

<div class="results-meta">
    <span id="results-meta"></span>
</div>

<ul id="session-list" class="session-list"></ul>

<div id="no-results" class="no-results" hidden>No sessions match the current filters. Clear them or broaden your search.</div>

<script src="assets/lunr.min.js"></script>
<script src="assets/app.js"></script>
