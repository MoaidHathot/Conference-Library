<!-- Body slot for layout.html. Populated by Build-Book.ps1 for one per-speaker
     page (docs/<Conf>/<Event>/speakers/<slug>.html). Server-rendered: the
     sessions list, co-presenter list, and topic/tag rollups are all assembled
     in PowerShell so this template stays trivial. -->

<section class="entity-hero">
    <div class="entity-hero-meta">
        <span class="entity-cat entity-cat-speaker">Speaker</span>
        {{HEADER_BADGES_HTML}}
    </div>
    <h1>{{SPEAKER_NAME}}</h1>
    <p class="entity-tagline">{{TAGLINE_HTML}}</p>
    <div class="entity-stats">
        {{STATS_HTML}}
    </div>
    {{NAME_VARIANTS_HTML}}
</section>

{{SECTIONS_HTML}}
